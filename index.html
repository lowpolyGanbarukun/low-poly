<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>利用規約｜ローポリで頑張るくん</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
:root { --ink:#111110; --sub:#55554E; --rule:#C9C6BE; --paper:#FFFFFF; }
* { box-sizing: border-box; }
body { margin:0; background:var(--paper); color:var(--ink);
  font-family:'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
  line-height:1.85; }
.wrap { max-width:720px; margin:0 auto; padding:56px 20px 80px; }
h1 { font-size:26px; line-height:1.4; margin:0 0 10px; }
.sub { font-size:12px; letter-spacing:.14em; color:var(--sub); margin-bottom:8px; }
.rule { border:0; border-top:3px solid var(--ink); margin:18px 0 32px; }
h2 { font-size:17px; margin:40px 0 12px; }
p { font-size:15px; margin:0 0 14px; }
ul.items { list-style:none; margin:0; padding:0; }
ul.items li { border-bottom:1px solid var(--rule); }
ul.items li:first-child { border-top:1px solid var(--rule); }
ul.items a { display:block; padding:16px 2px; text-decoration:none; color:var(--ink); }
ul.items a:hover { background:#F4F2EC; }
.nm { font-size:16px; font-weight:700; }
.meta { font-size:12px; color:var(--sub); margin-top:3px; }
.note { font-size:13px; color:var(--sub); border:1px solid var(--rule); padding:16px 18px; }
footer { margin-top:56px; padding-top:18px; border-top:1px solid var(--ink); font-size:12px; color:var(--sub); }
</style>
</head>
<body>
<div class="wrap">

  <div class="sub">ローポリで頑張るくん</div>
  <h1>利用規約</h1>
  <hr class="rule">

  <p>BOOTHで配布している商品の利用規約を置いています。商品ごとに1ページです。</p>
  <p>買う前に読めます。規約を変更したときも、このページでお知らせします。</p>

  <h2>独自規約の商品</h2>
  <ul class="items">
    <li><a href="sample/">
      <span class="nm">サンプル商品</span>
      <span class="meta">規約 Version 1.00／2026年10月3日</span>
    </a></li>
  </ul>

  <h2>VN3ライセンスの商品</h2>
  <p>2026年9月までに公開した商品はVN3ライセンスです。規約は商品に同梱しているPDFをご確認ください。</p>
  <div class="note">
    段ボール箱 宅配100サイズ／鮭弁当（お箸付き）／おりんセット（3.0寸・六角りん台）／念珠セット
  </div>

  <footer>
    お問い合わせはBOOTHのメッセージ機能をご利用ください。
  </footer>

</div>
</body>
</html>
